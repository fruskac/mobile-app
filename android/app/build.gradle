apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

configurations.all {
    exclude group: "com.facebook.fbjni", module: "fbjni-java-only"
}

project.ext.vectoricons = [
    iconFontNames: ["Ionicons.ttf"]
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"
def enableHermes = project.hasProperty("hermesEnabled") ? hermesEnabled.toBoolean() : true

react {
    // Build JS bundle for debug as well, so Android startup does not depend on Metro.
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

android {
    namespace "com.fruskac"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.fruskac"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.0.0"
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a"
        }
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include "armeabi-v7a", "x86", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst "lib/armeabi-v7a/libjsc.so"
        pickFirst "lib/arm64-v8a/libjsc.so"
        pickFirst "lib/x86/libjsc.so"
        pickFirst "lib/x86_64/libjsc.so"
        pickFirst "lib/armeabi-v7a/libfbjni.so"
        pickFirst "lib/arm64-v8a/libfbjni.so"
        pickFirst "lib/x86/libfbjni.so"
        pickFirst "lib/x86_64/libfbjni.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-android"

    if (enableHermes) {
        implementation "com.facebook.react:hermes-android"
    } else {
        implementation jscFlavor
    }
}

task copyDownloadableDepsToLibs(type: Copy) {
    def dependencyConfig = configurations.findByName("runtimeClasspath")
    if (dependencyConfig != null) {
        from dependencyConfig
    }
    into "libs"
}

tasks.matching { it.name == "compressDebugAssets" }.configureEach {
    dependsOn("copyDebugIconFonts")
}

tasks.matching { it.name == "compressReleaseAssets" }.configureEach {
    dependsOn("copyReleaseIconFonts")
}
